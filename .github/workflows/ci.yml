name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj

      - name: Build, test, and package
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Add README to package bundle
        shell: pwsh
        run: Copy-Item README.md artifacts/README.md

      - name: Upload Playnite packages
        uses: actions/upload-artifact@v4
        with:
          name: playnite-hdr-bridge
          path: |
            artifacts/*.pext
            artifacts/README.md
          if-no-files-found: error

      - name: Create automated build release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "build-$env:GITHUB_RUN_NUMBER"
          $title = "Automated build #$env:GITHUB_RUN_NUMBER"
          $assets = Get-ChildItem artifacts -File | ForEach-Object { $_.FullName }
          gh release create $tag @assets `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title $title `
            --notes-file README.md `
            --prerelease

      - name: Create versioned release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $assets = Get-ChildItem artifacts -File | ForEach-Object { $_.FullName }
          $notes = "docs/RELEASE_NOTES_$tag.md"
          if (-not (Test-Path $notes)) { $notes = "README.md" }
          gh release create $tag @assets `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "Playnite Vibeshine HDR Bridge $tag" `
            --notes-file $notes
